; Supervisor configuration for the LINE message forwarder.
; Copy this file to /etc/supervisor/conf.d/line-forwarder.conf and run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start line-forwarder:*

[group:line-forwarder]
programs=line-forwarder,line-forwarder-monitor

[program:line-forwarder]
command=/usr/bin/python3 /opt/line-message-forwarder/forwarder_enhanced.py
directory=/opt/line-message-forwarder
autostart=true
autorestart=true
startsecs=5
startretries=3
user=line-forwarder
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/opt/line-message-forwarder/data/forwarder.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=/opt/line-message-forwarder/data/forwarder.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10

[program:line-forwarder-monitor]
command=/usr/bin/python3 /opt/line-message-forwarder/monitors/process_monitor.py
directory=/opt/line-message-forwarder
autostart=true
autorestart=true
startsecs=5
startretries=3
user=line-forwarder
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/opt/line-message-forwarder/data/process_monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=/opt/line-message-forwarder/data/process_monitor.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
